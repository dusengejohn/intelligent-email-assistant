# restart: unless-stopped -> Docker starts the containers again whenever Docker
# Desktop starts (e.g. after a reboot), unless you stopped them yourself
# (`docker compose stop` / `down`).
services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false   # CI and fresh clones have no .env
    environment:
      # Absolute path (4 slashes) inside the volume below, so the database
      # survives container restarts. Overrides any DATABASE_URL in .env.
      DATABASE_URL: sqlite:////app/data/app.db
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"
    # Docker polls this to know when the API is actually ready, not just started.
    # Uses Python (already in the image) because python:3.12-slim has no curl.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
      start_interval: 1s

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy   # wait for a passing healthcheck, not just a running container
    ports:
      - "8080:80"

  # The Email Generator (Epic 3b): its own page + API in one container. It writes
  # sample emails with Claude and delivers them to the inbox's ingest endpoint.
  generator:
    build: ./generator
    restart: unless-stopped
    env_file:
      - path: .env        # ANTHROPIC_API_KEY and INGEST_TOKEN (the same token as the backend)
        required: false
    environment:
      # Service discovery: on the compose network "backend" is the inbox
      # container's name (Docker DNS), so no IP address is hard-coded. This is
      # the internal port 8000, not a host port.
      INBOX_URL: http://backend:8000
    ports:
      - "8081:8000"       # host 8081 -> container 8000 (the page and /api)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
      start_interval: 1s
    depends_on:
      backend:
        condition: service_healthy   # deliveries need a running inbox
