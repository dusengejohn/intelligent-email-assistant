services:
  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false   # CI and fresh clones have no .env
    environment:
      # Absolute path (4 slashes) inside the volume below, so the database
      # survives container restarts. Overrides any DATABASE_URL in .env.
      DATABASE_URL: sqlite:////app/data/app.db
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"
    # Docker polls this to know when the API is actually ready, not just started.
    # Uses Python (already in the image) because python:3.12-slim has no curl.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
      start_interval: 1s

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy   # wait for a passing healthcheck, not just a running container
    ports:
      - "8080:80"
