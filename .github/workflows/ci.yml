name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same PR cancels the older, now-stale run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # Installs Python from backend/.python-version and all deps from uv.lock;
      # --locked fails if uv.lock is out of date with pyproject.toml
      - run: uv sync --locked

      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  # The separate generator service (Epic 3b): its own project, lockfile and tests
  generator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: generator
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: generator/uv.lock

      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

      # The generator's page (generator/web): same checks as the inbox frontend
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: generator/web/package-lock.json
      - run: npm ci
        working-directory: generator/web
      - run: npm run lint
        working-directory: generator/web
      - run: npm test
        working-directory: generator/web
      - run: npm run build
        working-directory: generator/web

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci installs exactly what package-lock.json says (fails if it is out of date)
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    # Only spend time building images once lint + tests pass
    needs: [backend, frontend, generator]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose build
      - name: Backend and generator containers must not run as root
        run: |
          for service in backend generator; do
            uid="$(docker compose run --rm --no-deps -T "$service" id -u)"
            echo "$service runs as UID $uid"
            test "$uid" != "0"
          done
      - name: nginx config is valid
        # nginx -t parses the config without serving anything. It also resolves
        # `backend` (proxy_pass), which only exists on the compose network, so map
        # it to localhost for the check.
        run: |
          image="$(docker compose config --images | grep frontend)"
          docker run --rm --add-host backend:127.0.0.1 "$image" nginx -t
      - name: Smoke test the whole stack (no Claude call)
        # A throwaway .env: a dummy token shared by backend and generator, no API key.
        # data/ must be writable by the backend's UID 1000 (the runner is UID 1001).
        run: |
          printf 'INGEST_TOKEN=ci-smoke-token-not-a-secret\n' > .env
          mkdir -p data && chmod 777 data
          docker compose up -d --wait
          bash .github/scripts/compose_smoke.sh
      - name: Logs if something failed
        if: failure()
        run: docker compose logs --tail 50
      - name: Stop the stack
        if: always()
        run: docker compose down
