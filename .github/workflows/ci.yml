name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same PR cancels the older, now-stale run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # Installs Python from backend/.python-version and all deps from uv.lock;
      # --locked fails if uv.lock is out of date with pyproject.toml
      - run: uv sync --locked

      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci installs exactly what package-lock.json says (fails if it is out of date)
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    # Only spend time building images once lint + tests pass
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose build
      - name: Backend container must not run as root
        run: |
          uid="$(docker compose run --rm --no-deps -T backend id -u)"
          echo "backend runs as UID $uid"
          test "$uid" != "0"
