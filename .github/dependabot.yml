# Dependabot opens PRs when dependencies have updates.
#
# Policy:
# - Minor + patch updates are grouped into one weekly PR per ecosystem (low risk).
# - Major updates arrive as separate PRs, so one breaking change can't block the safe ones.
# - Runtime versions (Python, Node, @types/node) change only on purpose, in their own
#   story that updates Docker, CI and docs together — never through a bot PR.
version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule: { interval: weekly }
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # typescript-eslint 8.x only supports typescript <6.1. Remove this rule once a
      # typescript-eslint release supports TypeScript 7 (check: npm view typescript-eslint peerDependencies)
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Types must match the Node major we run on (node:22 in frontend/Dockerfile and CI)
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # The generator service (Epic 3b): same policy as backend/ and frontend/
  - package-ecosystem: uv
    directory: /generator
    schedule: { interval: weekly }
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /generator/web
    schedule: { interval: weekly }
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Same reasons as for /frontend above
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: [/backend, /frontend, /generator]
    schedule: { interval: weekly }
    ignore:
      # Stay on Python 3.12.x (matches backend/ and generator/.python-version used by CI tests)
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Stay on Node 22.x (matches CI's setup-node and @types/node)
      - dependency-name: node
        update-types: ["version-update:semver-major"]
