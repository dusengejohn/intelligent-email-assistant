# Runs automatically on `git commit`. Install once with:
#   cd backend && uv run pre-commit install
# Run manually on everything:  cd backend && uv run pre-commit run --all-files
# Skip in an emergency:        git commit --no-verify   (CI will still check)

repos:
  # Generic safety checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: detect-private-key   # stops you committing secrets/keys

  # Project checks — use the exact tool versions pinned in backend/uv.lock
  - repo: local
    hooks:
      - id: ruff-lint
        name: ruff lint (auto-fix)
        entry: uv run --directory backend ruff check --fix .
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false

      - id: ruff-format
        name: ruff format
        entry: uv run --directory backend ruff format .
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false

      - id: uv-lock
        name: uv.lock in sync with pyproject.toml
        entry: uv lock --check --directory backend
        language: system
        files: ^backend/(pyproject\.toml|uv\.lock)$
        pass_filenames: false

      - id: pytest
        name: pytest
        entry: uv run --directory backend pytest -q
        language: system
        files: ^backend/
        pass_filenames: false

      - id: eslint
        name: eslint (frontend)
        entry: npm --prefix frontend run lint
        language: system
        files: ^frontend/.*\.(ts|tsx|js|jsx)$
        pass_filenames: false
