server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the backend service (keeps the /api prefix,
    # which the FastAPI router expects)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Wait up to 3 minutes for the backend's answer (nginx default: 60 s).
        # POST /api/emails/generate with count=50 makes 5 sequential Claude calls
        # of ~12-15 s each (~65-80 s total). With the 60 s default, nginx returned
        # 504 to the browser while the backend still finished and saved the emails
        # (reproduced in docs/testing/epic-1.md).
        proxy_read_timeout 180s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
